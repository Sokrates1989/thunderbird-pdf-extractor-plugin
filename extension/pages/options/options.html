<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="settingsTitle"></title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1 data-i18n="settingsTitle"></h1>
      <p data-i18n="settingsIntroduction"></p>
      <section class="companion-setup" aria-labelledby="companion-heading">
        <h2 id="companion-heading" data-i18n="companionHeading"></h2>
        <p class="hint" data-i18n="companionDescription"></p>
        <a class="button-link" href="https://github.com/Sokrates1989/thunderbird-pdf-extractor-plugin/releases/latest" target="_blank" rel="noopener noreferrer" data-i18n="downloadCompanion"></a>
      </section>
      <label>
        <span data-i18n="languageLabel"></span>
        <select id="ui-language">
          <option value="de" data-i18n="languageGerman"></option>
          <option value="en" data-i18n="languageEnglish"></option>
        </select>
      </label>
      <p class="hint" data-i18n="languageHint"></p>
      <label>
        <span data-i18n="outputDirectoryLabel"></span>
        <span class="directory-controls">
          <input id="output-directory" type="text" data-i18n-placeholder="outputDirectoryPlaceholder" spellcheck="false">
          <button id="browse-button" type="button" data-i18n="selectDirectoryButton"></button>
        </span>
      </label>
      <p class="hint" data-i18n="outputDirectoryHint"></p>
      <label>
        <span data-i18n="imageModeLabel"></span>
        <select id="image-mode">
          <option value="placeholder" data-i18n="imageModePlaceholder"></option>
          <option value="embed" data-i18n="imageModeEmbed"></option>
        </select>
      </label>
      <p class="hint" data-i18n="imageModeHint"></p>
      <label class="checkbox-row">
        <input id="separator-pages" type="checkbox">
        <span data-i18n="separatorPagesLabel"></span>
      </label>
      <p class="hint" data-i18n="separatorPagesHint"></p>
      <div class="actions">
        <button id="test-button" type="button" data-i18n="diagnosticsButton"></button>
        <button id="save-button" class="primary" type="button" data-i18n="saveButton"></button>
      </div>
      <p id="status" aria-live="polite"></p>
      <section aria-labelledby="diagnostics-heading">
        <h2 id="diagnostics-heading" data-i18n="diagnosticsHeading"></h2>
        <p class="hint" data-i18n="diagnosticsHint"></p>
        <pre id="diagnostics-output" class="hidden" aria-live="polite"></pre>
      </section>
      <section>
        <h2 data-i18n="releaseScopeHeading"></h2>
        <p data-i18n="releaseScopeDescription"></p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
